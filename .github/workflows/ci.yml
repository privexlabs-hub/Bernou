name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, privacy boundary, unit tests, build audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Privacy boundary (static import rules)
        run: pnpm boundary
      - name: Privacy boundary meta-test (rules must actually reject a leak)
        run: pnpm boundary:meta
      - name: Unit + privacy tests
        run: pnpm test
      - name: Build
        run: pnpm --filter @bernou/web build
      - name: Privacy bundle audit (P7)
        run: pnpm privacy:bundle

  e2e:
    name: Playwright (fake media devices)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bernou/web exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
